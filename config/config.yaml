# Config de ejemplo de MapForge.
#
# Rutas relativas: se resuelven contra el directorio donde vive este YAML.
# Los grupos de "settings" espejan generation_settings.json de Maps4FS
# (defaults = los del artefacto golden); todo es opcional salvo project/map/inputs.

project:
  name: "Granja Bonita"                     # nombre del proyecto (título del mod)
  output_dir: "../output/FS25_Granja_bonita"     # directorio de salida (estructura de mod FS25)

map:
  size: 8192                          # lado del mapa en metros/píxeles (2048/4096/8192/16384)
  rotation: 0                         # grados; si != 0 el lienzo rotado es size × 1.5
  latitude: 49.1000      # centro del mapa (lat)
  longitude: 31.3000         # centro del mapa (lon)
  output_size: null                   # opcional: reescalar la salida a otro tamaño

inputs:
  # DEM uint16 a 1 px/m del tamaño background (map.size + 4096).
  heightmap: "../maps/dem_new_12k.png"
  # OSM XML local (sin descargas).
  osm: "../maps/custom.osm"
  # Template FS25: zip de Maps4FS o directorio ya extraído.
  template: "../templates/fs25-map-template.zip"
  # Schemas (por defecto, los de config/).
  texture_schema: "texture_schema.json"
  grle_schema: "grle_schema.json"

settings:
  # --- campos propios de MapForge ---
  seed: 42                            # seed global: dissolve + textura procedural
  input_height_scale: 0.003891050583657588   # metros = uint16 × escala (255/65535 = 1/257)

  dem:
    custom_dem: false                 # true: el heightmap YA es el DEM final normalizado (sin pipeline S2)
    adjust_terrain_to_ground_level: true
    multiplier: 1
    minimum_height_scale: 255
    plateau: 15                       # metros: shift del mínimo del terreno
    ceiling: 15                       # metros de margen sobre el máximo (height_scale)
    water_depth: 15
    blur_radius: 3                    # radio del blur gaussiano (impar; 0 = off)
    add_foundations: false            # fuera de alcance (espejo)
    water_bank_steepness: 2
    # --- campos propios de MapForge: aplanado de farmyards (sin equivalente
    #     en Maps4FS). Aplana el interior de cada landuse=farmyard a la media
    #     del área; se aplica ANTES que flatten_roads.
    flatten_farmyard: false           # off por defecto
    flatten_farmyard_feather: 8.0     # metros de transición HACIA FUERA del recinto
    flatten_farmyard_max_relief: 10.0 # m; descarta recintos con más desnivel
                                      # interior (landuse=farmyard sobredimensionado
                                      # en el OSM). null = sin límite

  background:
    generate_background: true
    generate_water: false             # fuera de alcance (espejo)
    water_blurriness: 20
    remove_center: true               # recorta las caras del cuadrado central map.size
    flatten_roads: true               # aplana el corredor de cada vía en el DEM
    flatten_water: false              # fuera de alcance (espejo)
    # --- campos propios de MapForge: integración del talud con el terreno ---
    flatten_roads_feather: null       # m de transición; null = 2 × width de la vía
    flatten_roads_smooth: 25.0        # m de ventana del suavizado longitudinal
                                      # del eje (quita baches; 0 = off)
    # --- subgrupo propio de MapForge: background procedural (sin satélite) ---
    procedural:
      resize_factor: 8                # subsample del DEM para el mesh (12288 → 1536)
      apply_decimation: true          # decimación quadric (fast_simplification)
      decimation_percent: 25          # % de caras conservadas
      decimation_aggression: 3
      texture_size: 4096              # lado de la textura procedural
      noise_octaves: 5                # octavas del ruido fBm
      # --- textura por relieve: el color sigue la orografía del DEM ---
      height_texture: true            # false = ruido plano sin relación con la altura
      palette_low: [101, 84, 59]      # RGB tierra (base de las cotas bajas)
      palette_high: [78, 105, 54]     # RGB verde (base de las cotas bajas)
      palette_rock: [122, 118, 110]   # RGB gris roca
      palette_snow: [238, 242, 247]   # RGB nieve
      # Cotas en METROS DE MUNDO (dem × z_scaling_factor, la misma Y del mesh).
      rock_height: 130                # m: inicio de la banda de roca
      snow_height: 200                # m: inicio de la banda de nieve
      band_blend: 25                  # m de mezcla entre bandas contiguas
      band_noise: 12                  # m de jitter fBm en la cota (bordes irregulares)
      slope_rock_deg: 30              # grados: pendiente desde la que aflora roca
      slope_rock_blend: 12            # grados de transición de los umbrales de pendiente
      snow_slope_limit_deg: 45        # grados: por encima la nieve no se agarra
      texture_flip_v: false           # true si el editor la renderiza al revés

  grle:
    farmland_margin: 5                # buffer mitre en px (1 px = 1 m) antes de ÷2
    add_farmyards: true
    base_price: 12500                 # pricePerHa de farmlands.xml
    price_scale: 100
    add_grass: true                   # hierba base en densityMap_fruits.png
    base_grass: "meadow"              # meadow=131 | smallDenseMix=33 (canal R)
    random_plants: false              # islas de plantas aleatorias sobre la hierba
    plants_island_minimum_size: 10    # px (solo si random_plants)
    plants_island_maximum_size: 200
    plants_island_vertex_count: 30
    plants_island_rounding_radius: 15
    plants_island_percent: 100        # nº de islas = map.size × porcentaje / 100
    fill_empty_farmlands: true        # píxeles 0 → 255

  i3d:
    add_trees: true                   # fuera de alcance: bosques excluidos (espejo)
    forest_density: 10
    tree_limit: 12500
    trees_relative_shift: 20
    spline_density: 2                 # puntos extra entre cada par de puntos
    add_reversed_splines: true
    field_splines: false
    license_plate_prefix: "M4F"
    self_clear: false
    displacement_layer_max_height: 0.2
    # --- campos propios de MapForge ---
    displacement_layer_size_factor: 8       # size = map.size × factor (FACT-source)
    displacement_layer_cell_size_base: 16384  # cellSize = base / map.size (inferido)

  texture:
    dissolve: false                   # reparto aleatorio por píxel entre sublayers
    fields_padding: 3                 # buffer(-padding) de los fields antes de rasterizar
    skip_drains: true
    use_cache: false                  # sin efecto en MapForge (espejo)
    use_precise_tags: false
