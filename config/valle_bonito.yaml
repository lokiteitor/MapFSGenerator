# Proyecto de validación: regenerar Valle Bonito desde los inputs del golden
# (FS25_Valle_Bonito/) con los settings de su generation_settings.json.
# La salida se compara contra el golden con tools/compare_golden.py.

project:
  name: "Valle Bonito"
  output_dir: "../output/valle_bonito"

map:
  size: 8192
  rotation: 0
  latitude: 43.145692357357156
  longitude: -95.1450786604236
  output_size: null

inputs:
  heightmap: "../FS25_Valle_Bonito/valle_bonito.png"   # DEM 12288² uint16
  osm: "../FS25_Valle_Bonito/custom_osm.osm"
  template: "../maps4fs-1.8.242/data/fs25-map-template.zip"
  texture_schema: "texture_schema.json"
  grle_schema: "grle_schema.json"

settings:
  seed: 42
  input_height_scale: 0.003891050583657588   # 255/65535 (convención del artefacto)

  # Espejo de FS25_Valle_Bonito/generation_settings.json (grupos en alcance).
  dem:
    # El golden se generó con custom_dem: true (main_settings.json):
    # valle_bonito.png YA es el DEM final normalizado y el pipeline S2 se omite.
    custom_dem: true
    adjust_terrain_to_ground_level: true
    multiplier: 1
    minimum_height_scale: 255
    plateau: 15
    ceiling: 15
    water_depth: 15
    blur_radius: 3
    add_foundations: false
    water_bank_steepness: 2

  background:
    generate_background: true
    generate_water: false
    water_blurriness: 20
    remove_center: true
    flatten_roads: true
    flatten_water: false
    procedural:
      resize_factor: 8
      apply_decimation: true
      decimation_percent: 25
      decimation_aggression: 3
      texture_size: 4096
      noise_octaves: 5
      palette_low: [101, 84, 59]
      palette_high: [78, 105, 54]

  grle:
    farmland_margin: 5
    add_farmyards: true
    base_price: 12500
    price_scale: 100
    add_grass: true
    base_grass: "meadow"
    random_plants: false
    fill_empty_farmlands: true

  i3d:
    add_trees: true
    forest_density: 10
    tree_limit: 12500
    trees_relative_shift: 20
    spline_density: 2
    add_reversed_splines: true
    field_splines: false
    license_plate_prefix: "M4F"
    self_clear: false
    displacement_layer_max_height: 0.2
    displacement_layer_size_factor: 8
    displacement_layer_cell_size_base: 16384

  texture:
    dissolve: false
    fields_padding: 3
    skip_drains: true
    use_cache: false
    use_precise_tags: false
